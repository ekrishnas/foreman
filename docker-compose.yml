# Postgres for Foreman's checkpoints, audit events and cost events (DESIGN.md section 15).
#   docker compose up -d
#   export FOREMAN_DB_URL=postgresql://foreman:foreman@localhost:5432/foreman
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: foreman
      POSTGRES_DB: foreman
    ports:
      - "5432:5432"
    volumes:
      - foreman-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foreman-db:
