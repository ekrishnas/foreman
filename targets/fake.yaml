# Throwaway Python target used by fake-mode runs and tests. `repo` is replaced
# with runs/<run_id>/target when a fake run starts.
name: fake
repo: runs/fake-target
spec_format: openspec
paths: { src: "src/**", tests: "tests/**", docs: "docs/**" }
commands:
  build: python -m compileall -q src
  test: python -m pytest -q
  run: "true"
  stop: "true"
  smoke: python scripts/smoke.py
health_url: http://localhost:8080/health
slo: { error_rate_max: 0.01, p95_ms_max: 200 }
dependency_manifests: ["requirements*.txt", "pyproject.toml"]
protected: ["**/migrations/**"]
