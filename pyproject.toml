[project]
name = "foreman"
version = "0.1.0"
description = "Governed agentic SDLC orchestrator"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
foreman = "foreman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foreman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs docker/postgres (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"
